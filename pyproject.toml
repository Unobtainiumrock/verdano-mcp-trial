[project]
name = "verdano-mcp"
version = "0.0.1"
description = "MCP server reconciling Tesco/Sainsbury forecast+EPOS against a mock ERP API for Verdano Foods weekly ops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "httpx>=0.27",
  "certifi>=2024.0.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "rapidfuzz>=3.14.5",
  "mcp>=1.0",
]

[project.optional-dependencies]
storage = ["duckdb>=1.0"]
llm = ["openai>=1.30"]

[project.scripts]
verdano-mcp = "verdano.mcp_server:run"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-recording>=0.13",
  "pyyaml>=6.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdano"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # math notation uses Greek letters (ε, γ, α, etc.)
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
